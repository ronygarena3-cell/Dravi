<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FormMail — Panel de formularios</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #12172B;
    --ink-soft: #2A3050;
    --paper: #FDFCF9;
    --paper-dim: #F1EFE9;
    --line: #DAD6CC;
    --stamp: #B3402C;
    --stamp-dim: #d8b3ab;
    --ok: #3C6E47;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--ink);
    color: var(--paper);
    font-family: 'IBM Plex Sans', sans-serif;
    min-height: 100vh;
  }
  h1, h2, h3 { font-family: 'Fraunces', serif; font-weight: 600; margin: 0; }
  .mono { font-family: 'IBM Plex Mono', monospace; }

  /* ---------- Layout general ---------- */
  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px 32px;
    border-bottom: 1px solid var(--ink-soft);
  }
  .topbar h1 { font-size: 22px; color: var(--paper); }
  .topbar h1 span { color: var(--stamp); }
  .topbar button {
    background: transparent;
    border: 1px solid var(--ink-soft);
    color: var(--paper);
    padding: 8px 16px;
    border-radius: 4px;
    cursor: pointer;
    font-family: inherit;
  }
  .topbar button:hover { border-color: var(--stamp); }

  main { max-width: 880px; margin: 0 auto; padding: 40px 24px 80px; }

  /* ---------- Login ---------- */
  #loginView { max-width: 380px; margin: 90px auto; text-align: left; }
  #loginView h1 { font-size: 34px; line-height: 1.15; margin-bottom: 8px; }
  #loginView p { color: #AFB3C8; margin-bottom: 28px; line-height: 1.5; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 13px; color: #AFB3C8; margin-bottom: 6px; }
  .field input {
    width: 100%;
    padding: 11px 12px;
    background: var(--ink-soft);
    border: 1px solid #3A4066;
    border-radius: 4px;
    color: var(--paper);
    font-family: inherit;
    font-size: 15px;
  }
  .field input:focus { outline: none; border-color: var(--stamp); }
  .btn-primary {
    width: 100%;
    padding: 12px;
    background: var(--stamp);
    color: var(--paper);
    border: none;
    border-radius: 4px;
    font-size: 15px;
    font-family: inherit;
    font-weight: 500;
    cursor: pointer;
    margin-top: 6px;
  }
  .btn-primary:hover { background: #9c3624; }
  .switch-mode { margin-top: 16px; font-size: 13px; color: #AFB3C8; }
  .switch-mode a { color: var(--paper); text-decoration: underline; cursor: pointer; }
  .error-msg { color: #E8998A; font-size: 13px; margin-top: 10px; min-height: 16px; }

  /* ---------- Panel principal ---------- */
  .panel-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 24px; }
  .panel-header h2 { font-size: 26px; color: var(--paper); }
  .btn-new {
    background: var(--paper);
    color: var(--ink);
    border: none;
    padding: 10px 18px;
    border-radius: 4px;
    font-family: inherit;
    font-weight: 500;
    cursor: pointer;
  }
  .btn-new:hover { background: var(--paper-dim); }

  .form-card {
    background: var(--paper);
    color: var(--ink);
    border-radius: 6px;
    padding: 20px 22px;
    margin-bottom: 14px;
    cursor: pointer;
    border: 1px solid transparent;
  }
  .form-card:hover { border-color: var(--stamp); }
  .form-card-top { display: flex; justify-content: space-between; align-items: center; }
  .form-card h3 { font-size: 18px; }
  .form-card .count { font-size: 13px; color: #6b6f80; }
  .endpoint-row {
    margin-top: 10px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: #6b6f80;
  }
  .endpoint-row code {
    background: var(--paper-dim);
    padding: 3px 8px;
    border-radius: 3px;
    font-family: 'IBM Plex Mono', monospace;
  }
  .endpoint-row button {
    border: 1px solid var(--line);
    background: none;
    border-radius: 3px;
    padding: 3px 9px;
    cursor: pointer;
    font-family: inherit;
    font-size: 12px;
    color: var(--ink);
  }
  .endpoint-row button:hover { border-color: var(--stamp); }

  .empty-state {
    background: var(--ink-soft);
    border-radius: 6px;
    padding: 40px 24px;
    text-align: center;
    color: #AFB3C8;
  }

  /* ---------- Vista de un formulario / submissions ---------- */
  .back-link { color: var(--paper); font-size: 14px; cursor: pointer; opacity: 0.8; margin-bottom: 18px; display: inline-block; }
  .back-link:hover { opacity: 1; }

  .submission-card {
    background: var(--paper);
    color: var(--ink);
    border-radius: 6px;
    padding: 18px 20px;
    margin-bottom: 12px;
  }
  .submission-card.unread { border-left: 4px solid var(--stamp); }
  .submission-meta { font-size: 12px; color: #6b6f80; margin-bottom: 10px; }
  .submission-fields dt { font-size: 12px; color: #6b6f80; margin-top: 8px; }
  .submission-fields dd { margin: 2px 0 0; font-size: 14px; }
  .submission-files { margin-top: 10px; font-size: 13px; }
  .submission-files a { color: var(--stamp); }

  /* ---------- Modal crear formulario ---------- */
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(18,23,43,0.7);
    display: flex; align-items: center; justify-content: center; z-index: 10;
  }
  .modal {
    background: var(--paper);
    color: var(--ink);
    border-radius: 6px;
    padding: 28px;
    width: 100%;
    max-width: 400px;
  }
  .modal h3 { margin-bottom: 4px; }
  .modal p { font-size: 13px; color: #6b6f80; margin: 0 0 20px; }
  .modal .field label { color: #6b6f80; }
  .modal .field input {
    background: var(--paper-dim);
    border: 1px solid var(--line);
    color: var(--ink);
  }
  .modal-actions { display: flex; gap: 10px; margin-top: 18px; }
  .modal-actions .btn-cancel {
    flex: 1; background: none; border: 1px solid var(--line);
    border-radius: 4px; padding: 11px; cursor: pointer; font-family: inherit; color: var(--ink);
  }
  .modal-actions .btn-primary { flex: 1; margin-top: 0; }

  .hidden { display: none !important; }
</style>
</head>
<body>

<!-- ======================= LOGIN ======================= -->
<div id="loginView">
  <main>
    <h1>Form<span>Mail</span></h1>
    <p>Recibe los envíos de cualquier formulario de tu web, sin backend propio.</p>

    <div class="field">
      <label for="email">Correo</label>
      <input type="email" id="email" placeholder="tu@correo.com">
    </div>
    <div class="field">
      <label for="password">Contraseña</label>
      <input type="password" id="password" placeholder="••••••••">
    </div>
    <button class="btn-primary" id="submitAuthBtn">Entrar</button>
    <div class="error-msg" id="authError"></div>
    <div class="switch-mode">
      <span id="switchModeText">¿No tienes cuenta? <a id="switchModeLink">Crear una</a></span>
    </div>
  </main>
</div>

<!-- ======================= APP (tras login) ======================= -->
<div id="appView" class="hidden">
  <div class="topbar">
    <h1>Form<span>Mail</span></h1>
    <button id="logoutBtn">Cerrar sesión</button>
  </div>

  <main>
    <!-- Vista: lista de formularios -->
    <div id="formsListView">
      <div class="panel-header">
        <h2>Tus formularios</h2>
        <button class="btn-new" id="newFormBtn">+ Nuevo formulario</button>
      </div>
      <div id="formsContainer"></div>
    </div>

    <!-- Vista: envíos de un formulario -->
    <div id="submissionsView" class="hidden">
      <span class="back-link" id="backToFormsBtn">← Todos los formularios</span>
      <div class="panel-header">
        <h2 id="submissionsFormName">—</h2>
      </div>
      <div class="endpoint-row" id="submissionsEndpointRow" style="margin-bottom: 24px;"></div>
      <div id="submissionsContainer"></div>
    </div>
  </main>
</div>

<!-- ======================= Modal: crear formulario ======================= -->
<div id="newFormModal" class="modal-backdrop hidden">
  <div class="modal">
    <h3>Nuevo formulario</h3>
    <p>Te daremos un endpoint para poner en el <code>action</code> de tu &lt;form&gt;.</p>
    <div class="field">
      <label for="formNameInput">Nombre (solo para identificarlo tú)</label>
      <input type="text" id="formNameInput" placeholder="Ej. Contacto web principal">
    </div>
    <div class="field">
      <label for="formNotifyInput">Correo donde recibir notificaciones</label>
      <input type="email" id="formNotifyInput" placeholder="tu@correo.com">
    </div>
    <div class="error-msg" id="newFormError"></div>
    <div class="modal-actions">
      <button class="btn-cancel" id="cancelNewFormBtn">Cancelar</button>
      <button class="btn-primary" id="confirmNewFormBtn">Crear</button>
    </div>
  </div>
</div>

<script type="module">
  /**
   * FIREBASE CONFIG
   * ---------------
   * Reemplaza esto con la config real de tu proyecto de Firebase
   * (Project settings → General → Your apps → SDK setup and configuration).
   * Ver GUIA.md / ESTADO.md del proyecto para el resto de contexto.
   */
  const firebaseConfig = {
    apiKey: "TU_API_KEY",
    authDomain: "TU_PROYECTO.firebaseapp.com",
    projectId: "TU_PROYECTO",
    storageBucket: "TU_PROYECTO.appspot.com",
    messagingSenderId: "TU_SENDER_ID",
    appId: "TU_APP_ID",
  };

  // Cambia esto por el dominio real donde despliegues tus Cloud Functions
  // (ver GUIA.md: el rewrite de firebase.json hace que el endpoint público
  // sea https://TU_DOMINIO/f/{formId}).
  const APP_DOMAIN = "https://tu-proyecto.web.app";

  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getAuth, onAuthStateChanged, signInWithEmailAndPassword,
    createUserWithEmailAndPassword, signOut,
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import {
    getFirestore, collection, doc, addDoc, setDoc, getDocs, query,
    orderBy, onSnapshot, updateDoc, serverTimestamp,
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  // ---------- Estado local mínimo ----------
  let currentUser = null;
  let isRegisterMode = false;
  let unsubscribeSubmissions = null;
  let currentOpenForm = null; // { id, ...data }

  // ---------- Referencias DOM ----------
  const loginView = document.getElementById("loginView");
  const appView = document.getElementById("appView");
  const authError = document.getElementById("authError");
  const switchModeText = document.getElementById("switchModeText");
  const switchModeLink = document.getElementById("switchModeLink");

  const formsListView = document.getElementById("formsListView");
  const submissionsView = document.getElementById("submissionsView");
  const formsContainer = document.getElementById("formsContainer");
  const submissionsContainer = document.getElementById("submissionsContainer");
  const submissionsFormName = document.getElementById("submissionsFormName");
  const submissionsEndpointRow = document.getElementById("submissionsEndpointRow");

  const newFormModal = document.getElementById("newFormModal");
  const newFormError = document.getElementById("newFormError");

  // ---------- Auth ----------
  onAuthStateChanged(auth, (user) => {
    currentUser = user;
    if (user) {
      loginView.classList.add("hidden");
      appView.classList.remove("hidden");
      loadForms();
    } else {
      loginView.classList.remove("hidden");
      appView.classList.add("hidden");
    }
  });

  switchModeLink.addEventListener("click", () => {
    isRegisterMode = !isRegisterMode;
    document.getElementById("submitAuthBtn").textContent = isRegisterMode ? "Crear cuenta" : "Entrar";
    switchModeText.innerHTML = isRegisterMode
      ? '¿Ya tienes cuenta? <a id="switchModeLink2">Entrar</a>'
      : '¿No tienes cuenta? <a id="switchModeLink">Crear una</a>';
    const newLink = document.getElementById(isRegisterMode ? "switchModeLink2" : "switchModeLink");
    newLink.addEventListener("click", () => switchModeLink.click());
  });

  document.getElementById("submitAuthBtn").addEventListener("click", async () => {
    authError.textContent = "";
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    if (!email || !password) {
      authError.textContent = "Rellena correo y contraseña.";
      return;
    }
    try {
      if (isRegisterMode) {
        const cred = await createUserWithEmailAndPassword(auth, email, password);
        // Guardamos el doc de usuario (ver GUIA.md → modelo de datos: users/{uid})
        await setDoc(doc(db, "users", cred.user.uid), {
          email,
          plan: "free",
          createdAt: serverTimestamp(),
        });
      } else {
        await signInWithEmailAndPassword(auth, email, password);
      }
    } catch (err) {
      authError.textContent = traducirErrorAuth(err.code);
    }
  });

  document.getElementById("logoutBtn").addEventListener("click", () => signOut(auth));

  function traducirErrorAuth(code) {
    const mapa = {
      "auth/email-already-in-use": "Ese correo ya tiene una cuenta.",
      "auth/invalid-email": "Correo no válido.",
      "auth/weak-password": "La contraseña debe tener al menos 6 caracteres.",
      "auth/invalid-credential": "Correo o contraseña incorrectos.",
      "auth/user-not-found": "Correo o contraseña incorrectos.",
      "auth/wrong-password": "Correo o contraseña incorrectos.",
    };
    return mapa[code] || "Algo salió mal, inténtalo de nuevo.";
  }

  // ---------- Listado de formularios ----------
  async function loadForms() {
    // NOTA: esto asume una regla/índice que permite consultar
    // "forms" filtrando por ownerUid == currentUser.uid.
    // Ver firestore.rules — falta añadir el índice compuesto si Firestore
    // lo pide la primera vez que corra esta query en producción.
    const { getDocs, collection, query, where, orderBy } = await import(
      "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js"
    );
    const q = query(
      collection(db, "forms"),
      where("ownerUid", "==", currentUser.uid),
      orderBy("createdAt", "desc")
    );
    const snap = await getDocs(q);
    const forms = [];
    for (const d of snap.docs) forms.push({ id: d.id, ...d.data() });
    renderFormsList(forms);
  }

  function renderFormsList(forms) {
    if (forms.length === 0) {
      formsContainer.innerHTML = `
        <div class="empty-state">
          Aún no tienes formularios. Crea uno para conseguir tu endpoint.
        </div>`;
      return;
    }
    formsContainer.innerHTML = forms.map((f) => `
      <div class="form-card" data-id="${f.id}">
        <div class="form-card-top">
          <h3>${escapeHtml(f.name || "Sin nombre")}</h3>
        </div>
        <div class="endpoint-row">
          <code>${APP_DOMAIN}/f/${f.id}</code>
          <button data-copy="${APP_DOMAIN}/f/${f.id}">Copiar</button>
        </div>
      </div>
    `).join("");

    formsContainer.querySelectorAll(".form-card").forEach((card) => {
      card.addEventListener("click", (e) => {
        if (e.target.dataset.copy) return; // el botón copiar tiene su propio handler
        const formId = card.dataset.id;
        const form = forms.find((f) => f.id === formId);
        openSubmissions(form);
      });
    });
    formsContainer.querySelectorAll("[data-copy]").forEach((btn) => {
      btn.addEventListener("click", (e) => {
        e.stopPropagation();
        navigator.clipboard.writeText(btn.dataset.copy);
        btn.textContent = "¡Copiado!";
        setTimeout(() => (btn.textContent = "Copiar"), 1500);
      });
    });
  }

  // ---------- Crear formulario ----------
  document.getElementById("newFormBtn").addEventListener("click", () => {
    document.getElementById("formNameInput").value = "";
    document.getElementById("formNotifyInput").value = currentUser.email || "";
    newFormError.textContent = "";
    newFormModal.classList.remove("hidden");
  });
  document.getElementById("cancelNewFormBtn").addEventListener("click", () => {
    newFormModal.classList.add("hidden");
  });
  document.getElementById("confirmNewFormBtn").addEventListener("click", async () => {
    const name = document.getElementById("formNameInput").value.trim();
    const notifyEmail = document.getElementById("formNotifyInput").value.trim();
    if (!name || !notifyEmail) {
      newFormError.textContent = "Rellena ambos campos.";
      return;
    }
    await addDoc(collection(db, "forms"), {
      ownerUid: currentUser.uid,
      name,
      notifyEmail,
      allowedOrigins: [], // vacío = cualquier origen permitido, ver spam.js
      createdAt: serverTimestamp(),
    });
    newFormModal.classList.add("hidden");
    loadForms();
  });

  // ---------- Ver envíos de un formulario ----------
  function openSubmissions(form) {
    currentOpenForm = form;
    formsListView.classList.add("hidden");
    submissionsView.classList.remove("hidden");
    submissionsFormName.textContent = form.name;
    submissionsEndpointRow.innerHTML = `
      <code>${APP_DOMAIN}/f/${form.id}</code>
      <button id="copyEndpointBtn">Copiar</button>
    `;
    document.getElementById("copyEndpointBtn").addEventListener("click", () => {
      navigator.clipboard.writeText(`${APP_DOMAIN}/f/${form.id}`);
    });

    if (unsubscribeSubmissions) unsubscribeSubmissions();
    const q = query(
      collection(db, "forms", form.id, "submissions"),
      orderBy("createdAt", "desc")
    );
    unsubscribeSubmissions = onSnapshot(q, (snap) => {
      const subs = [];
      snap.forEach((d) => subs.push({ id: d.id, ...d.data() }));
      renderSubmissions(form.id, subs);
    });
  }

  document.getElementById("backToFormsBtn").addEventListener("click", () => {
    if (unsubscribeSubmissions) unsubscribeSubmissions();
    submissionsView.classList.add("hidden");
    formsListView.classList.remove("hidden");
    loadForms();
  });

  function renderSubmissions(formId, subs) {
    if (subs.length === 0) {
      submissionsContainer.innerHTML = `
        <div class="empty-state">
          Todavía no llegó ningún envío. Prueba enviando tu &lt;form&gt; de prueba.
        </div>`;
      return;
    }
    submissionsContainer.innerHTML = subs.map((s) => {
      const fecha = s.createdAt ? s.createdAt.toDate().toLocaleString("es") : "—";
      const campos = Object.entries(s.data || {})
        .map(([k, v]) => `<dt>${escapeHtml(k)}</dt><dd>${escapeHtml(String(v))}</dd>`)
        .join("");
      const archivos = (s.files || []).length
        ? `<div class="submission-files">${s.files.map((u) => `<a href="${u}" target="_blank">${u}</a>`).join("<br>")}</div>`
        : "";
      return `
        <div class="submission-card ${s.read ? "" : "unread"}" data-id="${s.id}">
          <div class="submission-meta">${fecha}</div>
          <dl class="submission-fields">${campos}</dl>
          ${archivos}
        </div>`;
    }).join("");

    // Marcar como leído al hacer clic (mejora simple de UX)
    submissionsContainer.querySelectorAll(".submission-card.unread").forEach((el) => {
      el.addEventListener("click", () => {
        updateDoc(doc(db, "forms", formId, "submissions", el.dataset.id), { read: true });
      }, { once: true });
    });
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }
</script>
</body>
</html>
