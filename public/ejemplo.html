<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Formulario de contacto</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { font-family: sans-serif; max-width: 400px; margin: 40px auto; padding: 0 20px; }
    input, textarea { width: 100%; padding: 8px; margin-bottom: 10px; box-sizing: border-box; }
    button { padding: 10px 20px; background: #2e7d32; color: white; border: none; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>Contáctanos</h1>
  <form action="/f/contacto-web" method="POST">
    <input type="text" name="nombre" placeholder="Tu nombre" required>
    <input type="email" name="email" placeholder="Tu email" required>
    <textarea name="mensaje" placeholder="Tu mensaje" rows="4" required></textarea>

    <!-- Honeypot anti-spam: campo oculto, un humano nunca lo llena -->
    <input type="text" name="_honeypot" style="display:none" tabindex="-1" autocomplete="off">

    <!-- A dónde llega esta notificación (opcional, si no, usa NOTIFY_EMAIL) -->
    <input type="hidden" name="_to" value="tu-email@ejemplo.com">

    <button type="submit">Enviar</button>
  </form>
</body>
</html>
