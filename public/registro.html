<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Crea tu formulario</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { font-family: sans-serif; max-width: 480px; margin: 40px auto; padding: 0 20px; }
    input { width: 100%; padding: 10px; margin-bottom: 10px; box-sizing: border-box; }
    button { padding: 10px 20px; background: #2e7d32; color: white; border: none; border-radius: 4px; }
    pre { background: #f0f0f0; padding: 12px; white-space: pre-wrap; word-break: break-word; border-radius: 4px; }
    #resultado { display: none; margin-top: 20px; }
  </style>
</head>
<body>
  <h1>Crea tu formulario</h1>
  <p>Pon tu email, te damos un código para pegar en tu web. Todos los mensajes que
     te manden desde ahí llegarán a ese email.</p>

  <form id="form-registro">
    <input type="email" id="email" placeholder="tu-email@ejemplo.com" required>
    <button type="submit">Crear mi formulario</button>
  </form>

  <div id="resultado">
    <p>✅ Tu formulario está listo. Copia este código en tu web:</p>
    <pre id="codigo"></pre>
    <p>(También te lo mandamos por email por si lo pierdes)</p>
  </div>

  <script>
    document.getElementById('form-registro').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;

      const res = await fetch('/api/registro', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email }),
      });
      const data = await res.json();

      if (data.ok) {
        document.getElementById('codigo').textContent = data.codigo;
        document.getElementById('resultado').style.display = 'block';
      } else {
        alert('Error: ' + data.error);
      }
    });
  </script>
</body>
</html>
